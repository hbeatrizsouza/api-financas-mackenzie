
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <h1>Meu Financeiro</h1>
        <p>Organize seu dinheiro com consciência.</p>
    </header>

    <main class="container">

        <section class="dashboard">
            <h2>Resumo financeiro</h2>

            <div class="card">
                <h3>Saldo total</h3>
                <p id="saldoTotal">R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Total de despesas</h3>
                <p id="totalDespesas">R$ 0,00</p>
            </div>

            <div class="card impulso">
                <h3>Gastos por impulso</h3>
                <p id="totalGastoImpulso">R$ 0,00</p>
            </div>
        </section>

        <section class="formulario">
            <h2>Nova transação</h2>

            <form id="formTransacao">

                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" required>

                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" min="0.01" required>

                <label for="tipo">Tipo</label>
                <select id="tipo" required>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" required>

                <label class="checkbox">
                    <input type="checkbox" id="consumoConsciente">
                    Gasto consciente (essencial)
                </label>

                <button type="submit">Salvar transação</button>

            </form>
        </section>

        <section class="historico">
            <h2>Histórico de transações</h2>
            <div id="listaTransacoes">
                <p>Carregando transações...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Meu Financeiro © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
